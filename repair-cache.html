<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Refreshing SnapBooth</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111018; color: #f7f4ff; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { margin-bottom: .5rem; font-size: 1.5rem; }
    p { color: #c6bfd7; }
  </style>
</head>
<body>
  <main>
    <h1 id="status">Refreshing SnapBooth…</h1>
    <p id="message">Clearing the old local app cache. Your saved gallery photos are kept.</p>
  </main>
  <script>
    (async () => {
      if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
        document.getElementById('status').textContent = 'Open this page from your local development server.';
        document.getElementById('message').textContent = 'For example: http://localhost:5500/repair-cache.html';
        return;
      }

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          const appRegistrations = registrations.filter(registration =>
            [registration.active, registration.waiting, registration.installing].some(worker =>
              worker && new URL(worker.scriptURL).pathname.endsWith('/sw.js')
            )
          );
          await Promise.all(appRegistrations.map(registration => registration.unregister()));
        }

        const keys = await caches.keys();
        await Promise.all(keys.filter(key => key.startsWith('snapbooth-')).map(key => caches.delete(key)));
        location.replace('./index.html?fresh=' + Date.now());
      } catch (error) {
        document.getElementById('status').textContent = 'Could not refresh automatically.';
        document.getElementById('message').textContent = 'Reload the app once, or open Chrome DevTools and clear its service worker.';
        console.error('SnapBooth cache refresh failed:', error);
      }
    })();
  </script>
</body>
</html>
